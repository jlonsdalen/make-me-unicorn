name: "MMU Vibe Check"
description: >-
  Scan for the launch-blocking gaps AI-generated code misses most: hardcoded
  secrets, missing webhook signature verification, no password reset flow,
  f-string SQL, wildcard CORS, missing rate limits, DEBUG=True, and more.
  P0 findings fail the build.
author: "minjikim89"
branding:
  icon: "shield"
  color: "purple"

inputs:
  root:
    description: "Project root to scan (relative to the workspace)."
    required: false
    default: "."
  version:
    description: >-
      Version spec for make-me-unicorn, e.g. "==0.7.0". Empty installs the
      latest release from PyPI.
    required: false
    default: ""
  python-version:
    description: "Python version used to run the scan."
    required: false
    default: "3.12"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install make-me-unicorn
      shell: bash
      run: python -m pip install --quiet "make-me-unicorn${{ inputs.version }}"

    - name: Run vibe check
      shell: bash
      run: mmu vibecheck --root "${{ inputs.root }}"
